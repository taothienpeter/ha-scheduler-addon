name: Smart Calendar Scheduler
version: "1.0.0"
slug: smart_calendar_scheduler
description: "AI-based scheduling engine for Home Assistant using FastAPI"
url: "https://github.com/yourusername/scheduler-addon"
startup: services
boot: auto
arch:
  - aarch64
  - amd64
  - armv7
ports:
  5000/tcp: 5000
map:
  - config:rw
options:
  log_level: info
schema:
  log_level: match(info|debug|error|warning)
watchdog: true
healthcheck: curl --fail http://localhost:5000/health || exit 1
