name: "Smart Calendar Scheduler"
version: "1.0.0"
slug: "smart_calendar_scheduler"
description: "AI Scheduling Engine for Personal Task & Calendar Planning via n8n"
url: "https://github.com/yourusername/ha-scheduler-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "FastAPI Scheduler API"
map:
  - config:rw
options:
  log_level: info
schema:
  log_level: list(info|debug|warning|error)?
watchdog: true
